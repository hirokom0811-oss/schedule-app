<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>スケジューラー</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #fff; --border: #dfe3e8; --text: #1f2933; --muted: #6b7785;
  --primary: #2563eb; --primary-soft: #e8efff; --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
  --line-h: #b8c1cb; --line-30: #ccd3da; --line-15: #dde2e8;   /* 目盛り線：1時間／30分／15分（細かいほど薄いが、見える濃さにする） */
  --t-intro: #dbeafe; --t-intro-b: #3b82f6;
  --t-use: #dcfce7; --t-use-b: #22c55e;
  --t-people: #fef3c7; --t-people-b: #f59e0b;
  --t-misc: #e5e7eb; --t-misc-b: #9ca3af;
  --t-other: #ede9fe; --t-other-b: #8b5cf6;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: "Noto Sans JP", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
button { font: inherit; cursor: pointer; }
.hidden { display: none !important; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: sticky; top: 0; z-index: 20; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.ver { font-size: 10px; color: var(--muted); margin-left: 4px; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 5px 10px; color: var(--text); }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: #1d4ed8; }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-sm { padding: 2px 8px; font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--border); background: var(--surface); padding: 5px 12px; }
.seg button:last-child { border-right: 0; }
.seg button.active { background: var(--primary); color: #fff; }
#cal-title { font-weight: 600; min-width: 150px; text-align: center; }
.spacer { flex: 1; }
.badge { background: var(--danger); color: #fff; border-radius: 10px; font-size: 11px; padding: 0 6px; margin-left: 4px; }
#sync-banner { display: none; padding: 6px 12px; font-size: 13px; align-items: center; gap: 8px; background: #fff7ed; border-bottom: 1px solid #fed7aa; }

main { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
#cal-wrap { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
#side { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
.card h2 { font-size: 13px; margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between; }
.empty { color: var(--muted); font-size: 12px; }

/* grid */
.grid-head { display: grid; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 5; }  /* 見出しは本体と同じスクロール領域に置く（スクロールバー幅で列がずれるのを防ぐ） */
.grid-head div { padding: 6px 4px; text-align: center; font-size: 12px; border-left: 1px solid var(--border); cursor: pointer; }
.grid-head div:first-child { border-left: 0; cursor: default; }
.grid-head .today { color: var(--primary); font-weight: 700; }
.grid-body-wrap { max-height: calc(100vh - 150px); overflow-y: auto; }
.grid-body { display: grid; position: relative; }
.time-col div { height: var(--hh); border-bottom: 1px solid var(--border); font-size: 10px; color: var(--muted); padding: 2px 4px; background: var(--bg); }
.col { position: relative; border-left: 1px solid var(--border);
  background-image:
    linear-gradient(to bottom, transparent calc(100% - 1px), var(--line-h) 100%),
    linear-gradient(to bottom, transparent calc(100% - 1px), var(--line-30) 100%),
    linear-gradient(to bottom, transparent calc(100% - 1px), var(--line-15) 100%);
  background-size: 100% var(--hh), 100% calc(var(--hh) / 2), 100% calc(var(--hh) / 4); }
.grid-body.z0 .col { background-size: 100% var(--hh), 100% calc(var(--hh) / 2), 0 0; }  /* 標準：1時間と30分の線 */
.zoom-ctl { display: inline-flex; align-items: center; gap: 4px; }
.zoom-ctl .lbl { font-size: 11px; color: var(--muted); min-width: 64px; text-align: center; }
.col.today-col { background-color: #f8fbff; }
.blk { position: absolute; border-radius: 5px; border: 1px solid; padding: 2px 4px; font-size: 11px; overflow: hidden; cursor: pointer; user-select: none; line-height: 1.3; }
.blk .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .tm { color: var(--muted); font-size: 10px; }
.blk .tk { font-size: 10px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .tk.done { text-decoration: line-through; color: var(--muted); }
.blk.draft { border-style: dashed; opacity: .85; }
.blk .tag { position: absolute; top: 1px; right: 14px; font-size: 9px; background: #fff; border: 1px solid var(--warn); color: var(--warn); border-radius: 3px; padding: 0 3px; }
.blk .grip { position: absolute; top: 0; right: 0; width: 14px; height: 14px; font-size: 10px; text-align: center; cursor: grab; touch-action: none; color: var(--muted); }
.blk .resize { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; cursor: ns-resize; touch-action: none; }
.blk.dragging { opacity: .6; z-index: 10; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.th-導入 { background: var(--t-intro); border-color: var(--t-intro-b); }
.th-活用 { background: var(--t-use); border-color: var(--t-use-b); }
.th-ひとづくり { background: var(--t-people); border-color: var(--t-people-b); }
.th-コミュ・雑務 { background: var(--t-misc); border-color: var(--t-misc-b); }
.th-other { background: var(--t-other); border-color: var(--t-other-b); }
.th-none { background: #fff; border-color: var(--border); }
#drag-tip { position: fixed; z-index: 100; background: #111827; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; pointer-events: none; }
.nowline { position: absolute; left: 0; right: 0; border-top: 2px solid #ef4444; z-index: 3; pointer-events: none; }

/* month */
.month { display: grid; grid-template-columns: repeat(7, 1fr); }
.month .hd { text-align: center; font-size: 12px; padding: 4px; background: var(--bg); border-bottom: 1px solid var(--border); }
.month .cell { min-height: 92px; border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 3px; cursor: pointer; font-size: 11px; overflow: hidden; }
.month .cell.other { background: #fafafa; color: var(--muted); }
.month .cell.today .num { background: var(--primary); color: #fff; border-radius: 50%; padding: 0 5px; }
.month .chip { margin-top: 2px; padding: 1px 4px; border-radius: 3px; border: 1px solid; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* side */
.prop { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; font-size: 12px; }
.prop .why { color: var(--muted); margin: 2px 0 4px; }
.prop .acts { display: flex; gap: 6px; }
.task-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--bg); font-size: 12px; }
.task-row .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-row .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
.over { color: var(--danger); }

/* modal */
#modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 50; display: none; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; }
#modal-bg.open { display: flex; }
.modal { background: var(--surface); border-radius: 10px; width: 100%; max-width: 560px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.modal h3 { margin: 0 0 12px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
.row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
.row label { width: 64px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
.row input, .row select, .row textarea { flex: 1; min-width: 0; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; font: inherit; }
.modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.sect { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 8px; }
.sect h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
.rv-item { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
.rv-item .rt { font-weight: 600; font-size: 13px; }
.rv-btns { display: flex; gap: 6px; margin: 4px 0; }
.rv-btns button { width: 44px; font-size: 16px; }
.rv-btns button.sel-good { background: #dcfce7; border-color: var(--ok); }
.rv-btns button.sel-partial { background: #fef3c7; border-color: var(--warn); }
.rv-btns button.sel-bad { background: #fee2e2; border-color: var(--danger); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #111827; color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 200; display: none; font-size: 13px; }

@media (max-width: 900px) {
  main { flex-direction: column; align-items: stretch; padding: 8px; gap: 8px; }
  #cal-wrap, #side { width: 100%; }
  #side { flex-shrink: 1; }
  .grid-body-wrap { max-height: 70vh; }
  header { position: static; padding: 6px 8px; gap: 6px; }
  header h1 { font-size: 14px; margin-right: 4px; }
  .ver { display: none; }
  #cal-title { min-width: 0; font-size: 13px; flex: 1 1 100%; order: 10; text-align: left; }
  .btn { padding: 5px 8px; }
  .modal { padding: 12px; }
  .row label { width: 52px; }
  .row input[type=time], .row input[type=date] { min-width: 0; }
  .grid-head div { font-size: 10px; padding: 4px 1px; line-height: 1.2; }
  .blk { font-size: 10px; padding: 1px 2px; }
  .blk .tm { display: none; }
  .month .cell { min-height: 64px; font-size: 10px; padding: 2px; }
  /* 指で押せる大きさ（目安44px）に近づける：移動つまみと長さ変更の帯 */
  .blk .grip { width: 28px; height: 28px; font-size: 16px; line-height: 28px; }
  .blk .resize { height: 16px; }
  .blk .tag { display: none; }   /* 狭い列では「仮」ラベルを隠す（破線の枠で見分ける） */
  .rv-btns button { width: 52px; height: 40px; }
  .btn-sm { padding: 6px 10px; }
}
</style>
</head>
<body>
<header>
  <h1>スケジューラー<span class="ver" id="ver"></span></h1>
  <button class="btn" onclick="calPrev()">◀</button>
  <button class="btn" onclick="calToday()">今日</button>
  <button class="btn" onclick="calNext()">▶</button>
  <span id="cal-title"></span>
  <div class="seg" id="view-seg">
    <button data-view="day" onclick="setView('day')">日</button>
    <button data-view="week" onclick="setView('week')">週</button>
    <button data-view="month" onclick="setView('month')">月</button>
  </div>
  <span class="zoom-ctl"><button class="btn" onclick="zoomBy(-1)" title="縮小">－</button><span class="lbl" id="zoom-lbl"></span><button class="btn" onclick="zoomBy(1)" title="拡大">＋</button></span>
  <span class="spacer"></span>
  <button class="btn" id="confirm-btn" onclick="confirmWeek()">この週を確定</button>
  <button class="btn" id="review-btn" onclick="openReview()">📝 振り返り</button>
  <button class="btn" onclick="openIcs()">ICS</button>
  <button class="btn" onclick="openSettings()">⚙ 設定</button>
</header>
<div id="sync-banner"></div>
<main>
  <div id="cal-wrap"><div id="cal"></div></div>
  <aside id="side">
    <div class="card"><h2><span>候補（Claudeの提案）<span class="badge hidden" id="prop-badge">0</span></span></h2><div id="proposals"></div></div>
    <div class="card"><h2><span>未配置のタスク</span><span class="empty" id="task-count"></span></h2><div id="tasks"></div></div>
  </aside>
</main>
<div id="modal-bg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
'use strict';
const APP_VERSION = 'v0.2.1';
const GIST_FILE = 'schedule_data.json';
const DAY_START = 6, DAY_END = 23;       // 表示する時間帯
// 拡大レベル：1時間の高さ(px)と、ドラッグの刻み(分)。拡大するほど細かく動かせる（Shift押下中は5分）
const ZOOMS = [
  { hh: 48,  snap: 30, label: '標準' },
  { hh: 96,  snap: 15, label: '拡大' },
  { hh: 168, snap: 15, label: '最大' },
];
let HH = ZOOMS[0].hh;                     // 現在の1時間あたりのpx
const snapMin = (e) => (e && e.shiftKey) ? 5 : ZOOMS[S.zoom].snap;
const DN = ['日','月','火','水','木','金','土'];
const SCALE_MIN = { small: 15, medium: 45, large: 90, super: 120 };
const SCALE_LABEL = { small: '小', medium: '中', large: '大', super: '特大' };
const DEFAULT_THEMES = ['導入','活用','ひとづくり','コミュ・雑務'];

// ───────── util ─────────
function uuid() {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID.call(crypto);
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });
}
const pad = n => String(n).padStart(2, '0');
function dateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(ds) { return new Date(ds + 'T12:00:00'); }
function today() { return dateStr(new Date()); }
function addDays(ds, n) { const d = parseDate(ds); d.setDate(d.getDate() + n); return dateStr(d); }
function weekStart(ds) { const d = parseDate(ds); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return dateStr(d); }
function toMin(t) { const [h, m] = t.split(':').map(Number); return h*60 + m; }
function fromMin(m) { return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }
function h(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dowLabel(ds) { return DN[parseDate(ds).getDay()]; }
function fmtMD(ds) { const d = parseDate(ds); return `${d.getMonth()+1}/${d.getDate()}(${DN[d.getDay()]})`; }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(showToast._t); showToast._t = setTimeout(() => t.style.display = 'none', 2600); }

// ───────── state / storage ─────────
const S = {
  blocks: [],        // {id,title,theme,date,startTime,endTime,recurrence,recurrenceEnd,status('draft'|'confirmed'|undefined=確定扱い),createdAt}
  tasks: [],         // {id,title,dueDate,priority,scale,completed,blockIds[],memo,...}
  blockTemplates: [],// {id,title,startTime,endTime,theme}
  themes: DEFAULT_THEMES.slice(),
  reviews: [],       // {id,date,items:[{blockId,taskId,title,result:'good'|'partial'|'bad'|null,comment}],memo,createdAt}
  proposals: [],     // {id,date,kind:'link'|'move',taskId,blockId,toDate,toStart,toEnd,reason,status:'pending'|'approved'|'dismissed',createdAt}
  changes: [],       // {id,at,blockId,kind,before,after}
  view: 'week',
  cur: today(),
  zoom: 0,           // ZOOMS のインデックス
};
const KEYS = { blocks:'sched_blocks', tasks:'sched_tasks', blockTemplates:'sched_templates', themes:'sched_themes', reviews:'sched_reviews', proposals:'sched_proposals', changes:'sched_changes' };
function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
function loadAll() {
  for (const [prop, key] of Object.entries(KEYS)) {
    const raw = lsGet(key);
    if (raw) { try { S[prop] = JSON.parse(raw); } catch (_) {} }
  }
  normalizeData();
}
function normalizeData() {
  if (!Array.isArray(S.themes)) S.themes = (S.themes && S.themes.work) ? S.themes.work.slice() : DEFAULT_THEMES.slice();
  for (const k of ['blocks','tasks','blockTemplates','reviews','proposals','changes']) if (!Array.isArray(S[k])) S[k] = [];
  S.tasks.forEach(t => { if (!Array.isArray(t.blockIds)) t.blockIds = t.blockId ? [t.blockId] : []; });
}
let _dirty = false;
function save() {
  for (const [prop, key] of Object.entries(KEYS)) lsSet(key, JSON.stringify(S[prop]));
  _dirty = true; showBanner();
}
function showBanner() {
  const b = document.getElementById('sync-banner');
  if (!lsGet('sched_gist_token') || !lsGet('sched_gist_id')) { b.style.display = 'none'; return; }
  b.style.display = 'flex';
  b.innerHTML = `<span>💾 未保存の変更があります</span><button class="btn btn-sm btn-primary" onclick="gistPush()">☁ 今すぐ保存</button>`;
}
function hideBanner() { document.getElementById('sync-banner').style.display = 'none'; }

// ───────── block logic ─────────
function isBlockOnDate(b, ds) {
  if (!b.recurrence) return b.date === ds;
  if (ds < b.date) return false;
  if (b.recurrenceEnd && ds > b.recurrenceEnd) return false;
  if (b.recurrence === 'daily') return true;
  if (b.recurrence === 'weekday') { const w = parseDate(ds).getDay(); return w >= 1 && w <= 5; }
  if (b.recurrence === 'weekly') { const diff = Math.round((parseDate(ds) - parseDate(b.date)) / 86400000); return diff >= 0 && diff % 7 === 0; }
  return false;
}
const isDraft = b => b.status === 'draft';
const blockById = id => S.blocks.find(b => b.id === id);
const taskById = id => S.tasks.find(t => t.id === id);
const blockTasks = id => S.tasks.filter(t => (t.blockIds || []).includes(id));
function blocksOn(ds) { return S.blocks.filter(b => isBlockOnDate(b, ds)).sort((a, b) => a.startTime.localeCompare(b.startTime)); }
function blockStats(b) {
  const ts = blockTasks(b.id);
  const used = ts.reduce((s, t) => s + (SCALE_MIN[t.scale] || 15), 0);
  return { total: ts.length, done: ts.filter(t => t.completed).length, used, free: (toMin(b.endTime) - toMin(b.startTime)) - used };
}
function effectiveTitle(b) { const ts = blockTasks(b.id); return ts.length ? ts.map(t => t.title).join('; ') : (b.title || '作業枠'); }
function themeClass(theme) {
  if (!theme) return 'th-none';
  return DEFAULT_THEMES.includes(theme) ? 'th-' + theme : 'th-other';
}
function logChange(b, kind, before, after) {
  if (!b || isDraft(b)) return;           // 確定済みの予定の変更だけ記録する（計画と実績の差を見るため）
  S.changes.push({ id: uuid(), at: new Date().toISOString(), blockId: b.id, title: b.title, kind, before, after });
  if (S.changes.length > 500) S.changes = S.changes.slice(-500);
}
const snap = b => ({ date: b.date, startTime: b.startTime, endTime: b.endTime, title: b.title });

function addBlock(d) {
  const b = { id: uuid(), title: d.title || '', theme: d.theme || '', date: d.date, startTime: d.startTime, endTime: d.endTime,
    recurrence: d.recurrence || null, recurrenceEnd: d.recurrenceEnd || null, status: d.status || 'draft', createdAt: new Date().toISOString() };
  S.blocks.push(b); save(); return b.id;
}
function updateBlock(id, data, kind) {
  const i = S.blocks.findIndex(b => b.id === id); if (i < 0) return;
  const before = snap(S.blocks[i]);
  S.blocks[i] = { ...S.blocks[i], ...data };
  logChange(S.blocks[i], kind || 'edit', before, snap(S.blocks[i]));
  save();
}
function deleteBlock(id) {
  const b = blockById(id);
  if (b) logChange(b, 'delete', snap(b), null);
  S.blocks = S.blocks.filter(x => x.id !== id);
  S.tasks.forEach(t => { t.blockIds = (t.blockIds || []).filter(x => x !== id); });
  S.proposals.forEach(p => { if (p.blockId === id && p.status === 'pending') p.status = 'dismissed'; });
  save();
}
function linkTask(taskId, blockId) {
  const t = taskById(taskId); if (!t) return;
  if (!t.blockIds.includes(blockId)) { t.blockIds.push(blockId); logChange(blockById(blockId), 'link', null, { task: t.title }); save(); }
}
function unlinkTask(taskId, blockId) {
  const t = taskById(taskId); if (!t) return;
  t.blockIds = t.blockIds.filter(x => x !== blockId); logChange(blockById(blockId), 'unlink', { task: t.title }, null); save();
}

// ───────── rendering: calendar ─────────
function renderAll() {
  document.getElementById('ver').textContent = APP_VERSION;
  document.querySelectorAll('#view-seg button').forEach(b => b.classList.toggle('active', b.dataset.view === S.view));
  renderCalendar(); renderSide(); updateTitle(); updateZoomLabel();
}
function updateTitle() {
  let t = '';
  if (S.view === 'month') { const d = parseDate(S.cur); t = `${d.getFullYear()}年 ${d.getMonth()+1}月`; }
  else if (S.view === 'week') { const s = weekStart(S.cur); t = `${fmtMD(s)} – ${fmtMD(addDays(s, 6))}`; }
  else t = `${S.cur.replace(/-/g, '/')}(${dowLabel(S.cur)})`;
  document.getElementById('cal-title').textContent = t;
  document.getElementById('confirm-btn').classList.toggle('hidden', S.view === 'month');

function layoutLanes(blocks) {
  // 重なる予定を横に並べる（クラスタごとにレーン分割）
  const items = blocks.map(b => ({ b, s: toMin(b.startTime), e: toMin(b.endTime), lane: 0, lanes: 1 }));
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    const laneEnds = [];
    cluster.forEach(it => {
      let l = laneEnds.findIndex(end => end <= it.s);
      if (l < 0) { l = laneEnds.length; laneEnds.push(0); }
      laneEnds[l] = it.e; it.lane = l;
    });
    cluster.forEach(it => it.lanes = laneEnds.length);
    cluster = []; clusterEnd = -1;
  };
  items.forEach(it => { if (cluster.length && it.s >= clusterEnd) flush(); cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e); });
  if (cluster.length) flush();
  return items;
}

function renderGrid(con, days) {
  const narrow = window.innerWidth <= 900;
  const cols = `${narrow ? 34 : 46}px repeat(${days.length}, minmax(0, 1fr))`;
  let html = `<div class="grid-body-wrap" id="gbw"><div class="grid-head" style="grid-template-columns:${cols}"><div></div>`;
  days.forEach(ds => html += `<div class="${ds === today() ? 'today' : ''}" onclick="jumpToDay('${ds}')">${narrow && days.length > 1 ? `${parseDate(ds).getDate()}<br>${dowLabel(ds)}` : fmtMD(ds)}</div>`);
  html += `</div><div class="grid-body z${S.zoom}" id="gb" style="grid-template-columns:${cols};--hh:${HH}px">`;
  html += '<div class="time-col">';

  html += '</div>';
  const total = (DAY_END - DAY_START) * HH;
  days.forEach(ds => {
    html += `<div class="col ${ds === today() ? 'today-col' : ''}" data-date="${ds}" style="height:${total}px">`;
    layoutLanes(blocksOn(ds)).forEach(({ b, s, e, lane, lanes }) => {
      const top = (s - DAY_START*60) / 60 * HH;
      const height = Math.max(18, (e - s) / 60 * HH - 1);
      const w = 100 / lanes;
      const st = blockStats(b); const ts = blockTasks(b.id);
      html += `<div class="blk ${themeClass(b.theme)} ${isDraft(b) ? 'draft' : ''}" data-id="${b.id}" data-date="${ds}"
        style="top:${top}px;height:${height}px;left:calc(${lane*w}% + 1px);width:calc(${w}% - 3px)">
        ${isDraft(b) ? '<span class="tag">仮</span>' : ''}<span class="grip" title="ドラッグで移動">⠿</span>
        <div class="t">${h(b.title || '作業枠')}</div><div class="tm">${b.startTime}–${b.endTime}${st.total ? ` ・${st.done}/${st.total}` : ''}</div>
        ${days.length === 1 || height > 56 ? ts.slice(0, 5).map(t => `<div class="tk ${t.completed ? 'done' : ''}">${h(t.title)}</div>`).join('') : ''}

  html += '</div></div>';

  const wrap = document.getElementById('gbw');

}

// ───────── drag / click ─────────
let _drag = null, _justDragged = false;
function bindGrid() {
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('click', e => {
      if (e.target !== col) return;
      const y = e.clientY - col.getBoundingClientRect().top;
      const sn = snapMin(e);
      const m = DAY_START*60 + Math.floor(y / HH * 60 / sn) * sn;
      openBlock(null, col.dataset.date, fromMin(Math.min(m, 23*60)), fromMin(Math.min(m + 60, 24*60 - sn)));
    });
  });
  document.querySelectorAll('.blk').forEach(el => {
    el.addEventListener('click', e => { if (_justDragged) return; openBlock(el.dataset.id, el.dataset.date); });
    el.addEventListener('pointerdown', onBlkDown);
  });
}
function onBlkDown(e) {
  if (e.button !== 0) return;
  const el = e.currentTarget;
  const onGrip = e.target.classList.contains('grip'), onResize = e.target.classList.contains('resize');
  if (e.pointerType === 'touch' && !onGrip && !onResize) return;
  const b = blockById(el.dataset.id); if (!b) return;
  _drag = { el, b, mode: onResize ? 'resize' : 'move', x0: e.clientX, y0: e.clientY, s0: toMin(b.startTime), e0: toMin(b.endTime), date0: el.dataset.date, moved: false, date: el.dataset.date, s: toMin(b.startTime), e: toMin(b.endTime) };
  try { el.setPointerCapture(e.pointerId); } catch (_) { /* 取得できなくても、要素上の移動は拾える */ }
  el.addEventListener('pointermove', onBlkMove);
  el.addEventListener('pointerup', onBlkUp);
  el.addEventListener('pointercancel', onBlkUp);
}
function onBlkMove(e) {
  const d = _drag; if (!d) return;
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  if (!d.moved && Math.hypot(dx, dy) < 5) return;
  d.moved = true; d.el.classList.add('dragging');
  const sn = snapMin(e);
  const dm = Math.round(dy / HH * 60 / sn) * sn;
  const dur = d.e0 - d.s0;
  if (d.mode === 'move') {
    d.s = Math.max(DAY_START*60, Math.min(DAY_END*60 - dur, d.s0 + dm)); d.e = d.s + dur;
    if (!d.b.recurrence && S.view === 'week') {
      d.el.style.pointerEvents = 'none';
      const under = document.elementsFromPoint(e.clientX, e.clientY).find(n => n.classList && n.classList.contains('col'));
      d.el.style.pointerEvents = '';
      if (under) d.date = under.dataset.date;
    }
  } else {
    d.e = Math.max(d.s0 + sn, Math.min(DAY_END*60, d.e0 + dm)); d.s = d.s0;
  }
  d.el.style.transform = `translate(${d.mode === 'move' ? dx : 0}px, ${(d.mode === 'move' ? (d.s - d.s0) / 60 * HH : 0)}px)`;
  if (d.mode === 'resize') d.el.style.height = Math.max(18, (d.e - d.s) / 60 * HH - 1) + 'px';
  let tip = document.getElementById('drag-tip');
  if (!tip) { tip = document.createElement('div'); tip.id = 'drag-tip'; document.body.appendChild(tip); }
  tip.textContent = `${fmtMD(d.date)} ${fromMin(d.s)}–${fromMin(d.e)}`;
  tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px';
}
function onBlkUp(e) {
  const d = _drag; if (!d) return;
  d.el.removeEventListener('pointermove', onBlkMove); d.el.removeEventListener('pointerup', onBlkUp); d.el.removeEventListener('pointercancel', onBlkUp);
  const tip = document.getElementById('drag-tip'); if (tip) tip.remove();

  _justDragged = true; setTimeout(() => _justDragged = false, 50);
  const startTime = fromMin(d.s), endTime = fromMin(d.e);
  if (d.b.recurrence) {
    if (startTime !== d.b.startTime || endTime !== d.b.endTime) updateBlock(d.b.id, { startTime, endTime }, 'move');
  } else if (d.date !== d.b.date || startTime !== d.b.startTime || endTime !== d.b.endTime) {
    updateBlock(d.b.id, { date: d.date, startTime, endTime }, 'move');
  }
  renderAll();
}

// ───────── rule-based suggestion (イ) ─────────
function taskScore(t) {
  let score = 0; const why = [];
  if (t.dueDate) {
    const d = Math.round((parseDate(t.dueDate) - parseDate(today())) / 86400000);
    if (d < 0) { score += 100 + Math.min(-d, 30); why.push(`期限超過${-d}日`); }
    else if (d <= 7) { score += 60 - d*3; why.push(`期限まで${d}日`); }
    else if (d <= 30) { score += 20; why.push(`期限まで${d}日`); }
  }
  const pr = { high: 30, medium: 10, low: 0 }[t.priority];
  if (pr) { score += pr; if (t.priority === 'high') why.push('優先度高'); }
  return { score, why };
}
function suggestFor(b) {

  return S.tasks.filter(t => !t.completed && !(t.blockIds || []).includes(b.id))
    .map(t => ({ t, ...taskScore(t), min: SCALE_MIN[t.scale] || 15 }))
    .filter(x => x.min <= Math.max(free, 0))
    .sort((a, b2) => b2.score - a.score || a.min - b2.min).slice(0, 5);
}

  openModal(`<h3>「${h(t.title)}」を配置<button class="btn btn-sm" onclick="closeModal()">✕</button></h3>
    <div class="empty" style="margin-bottom:6px">表示中の期間の枠から選びます（見積${SCALE_MIN[t.scale] || 15}分）</div>
    ${rows.map(({ ds, b }) => { const st = blockStats(b); return `<div class="task-row"><span class="ttl">${fmtMD(ds)} ${b.startTime}–${b.endTime} ${h(b.title || '作業枠')}${isDraft(b) ? '（仮）' : ''}</span><span class="meta ${st.free < (SCALE_MIN[t.scale] || 15) ? 'over' : ''}">残${Math.max(st.free, 0)}分</span><button class="btn btn-sm" onclick="placeTask('${t.id}','${b.id}')">入れる</button></div>`; }).join('') || '<div class="empty">この期間に枠がありません</div>'}`);
}
function placeTask(taskId, blockId) { linkTask(taskId, blockId); closeModal(); renderAll(); showToast('配置しました'); }

// ───────── confirm week ─────────
function confirmWeek() {
  const ws = weekStart(S.cur), we = addDays(ws, 6);
  const targets = S.blocks.filter(b => isDraft(b) && !b.recurrence && b.date >= ws && b.date <= we);
  const recur = S.blocks.filter(b => isDraft(b) && b.recurrence && Array.from({length: 7}, (_, i) => addDays(ws, i)).some(ds => isBlockOnDate(b, ds)));
  const all = [...targets, ...recur];
  if (!all.length) { showToast('この週に「仮」の予定はありません'); return; }
  if (!confirm(`${fmtMD(ws)}〜${fmtMD(we)} の「仮」${all.length}件を確定にします。よろしいですか？`)) return;
  all.forEach(b => { b.status = 'confirmed'; });
  save(); renderAll(); showToast(`${all.length}件を確定しました`);
}

// ───────── review ─────────
let _rv = null;
function openReview() {
  const ds = S.cur;
  const existing = S.reviews.find(r => r.date === ds);
  const items = [];
  blocksOn(ds).filter(b => b.theme).forEach(b => {
    const ts = blockTasks(b.id);
    if (ts.length) ts.forEach(t => items.push({ blockId: b.id, taskId: t.id, title: t.title, slot: `${b.startTime}–${b.endTime}` }));
    else items.push({ blockId: b.id, taskId: null, title: b.title || '作業枠', slot: `${b.startTime}–${b.endTime}` });
  });
  items.forEach(it => {
    const prev = existing && existing.items.find(x => x.blockId === it.blockId && x.taskId === it.taskId);
    it.result = prev ? prev.result : null; it.comment = prev ? prev.comment || '' : '';
    if (!prev && it.taskId && taskById(it.taskId)?.completed) it.result = 'good';
  });
  _rv = { date: ds, items, memo: existing ? existing.memo || '' : '' };
  renderReview();
}
function renderReview() {
  const r = _rv;
  openModal(`<h3>${fmtMD(r.date)} の振り返り<button class="btn btn-sm" onclick="closeModal()">✕</button></h3>
    ${r.items.map((it, i) => `<div class="rv-item"><div class="rt">${it.slot} ${h(it.title)}</div>
      <div class="rv-btns">${[['good', '○'], ['partial', '△'], ['bad', '×']].map(([v, l]) => `<button class="btn ${it.result === v ? 'sel-' + v : ''}" onclick="setResult(${i},'${v}')">${l}</button>`).join('')}</div>
      <input style="width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:6px;font:inherit" placeholder="理由・実際にやったこと" value="${h(it.comment)}" oninput="_rv.items[${i}].comment=this.value"></div>`).join('') || '<div class="empty">この日の振り返り対象（テーマ付きの予定）がありません</div>'}
    <div class="row"><label>一言</label><input value="${h(r.memo)}" oninput="_rv.memo=this.value"></div>
    <div class="foot"><span class="spacer"></span><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn btn-primary" onclick="saveReview()">保存</button></div>`);
}
function setResult(i, v) { const it = _rv.items[i]; it.result = it.result === v ? null : v; renderReview(); }
function saveReview() {
  const r = _rv; const rec = { id: uuid(), date: r.date, items: r.items.map(({ blockId, taskId, title, result, comment }) => ({ blockId, taskId, title, result, comment })), memo: r.memo, createdAt: new Date().toISOString() };
  const i = S.reviews.findIndex(x => x.date === r.date);
  if (i >= 0) { rec.id = S.reviews[i].id; S.reviews[i] = rec; } else S.reviews.push(rec);
  save(); closeModal(); showToast('振り返りを保存しました');
}

// ───────── ICS ─────────
function openIcs() {
  const ws = weekStart(S.cur);
  openModal(`<h3>ICS出力（会社Outlook用）<button class="btn btn-sm" onclick="closeModal()">✕</button></h3>
    <div class="row"><label>開始日</label><input type="date" id="ics-from" value="${S.view === 'day' ? S.cur : ws}"></div>
    <div class="row"><label>終了日</label><input type="date" id="ics-to" value="${S.view === 'day' ? S.cur : addDays(ws, 6)}"></div>
    <div class="empty">テーマの付いた予定だけを出力します。タイトルは、タスクが紐づいていればタスク名、なければ枠の名前です。</div>
    <div class="foot"><span class="spacer"></span><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn btn-primary" onclick="exportIcs()">出力</button></div>`);
}
function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/,/g, '\\,').replace(/;/g, '\\;').replace(/\n/g, '\\n'); }
function toUtc(ds, tm) {
  const d = new Date(`${ds}T${tm}:00+09:00`);
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
}
function buildIcs(from, to, includeDraft) {
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Schedule App//JA', 'CALSCALE:GREGORIAN'];
  let n = 0;
  for (let ds = from; ds <= to; ds = addDays(ds, 1)) {
    blocksOn(ds).filter(b => b.theme && (includeDraft || !isDraft(b))).forEach(b => {
      lines.push('BEGIN:VEVENT', `SUMMARY:${icsEscape(effectiveTitle(b))}`, `DTSTART:${toUtc(ds, b.startTime)}`, `DTEND:${toUtc(ds, b.endTime)}`, `CATEGORIES:${icsEscape(b.theme)}`, 'END:VEVENT'); n++;
    });
  }
  lines.push('END:VCALENDAR');
  return { text: lines.join('\r\n'), n };
}
function exportIcs() {
  const from = document.getElementById('ics-from').value, to = document.getElementById('ics-to').value;
  if (!from || !to || to < from) { showToast('期間を確認してください'); return; }
  let include = false;
  const drafts = (() => { let c = 0; for (let ds = from; ds <= to; ds = addDays(ds, 1)) c += blocksOn(ds).filter(b => b.theme && isDraft(b)).length; return c; })();
  if (drafts) include = confirm(`「仮」の予定が${drafts}件あります。含めますか？\n［OK］含める ／ ［キャンセル］確定のみ出力`);
  const { text, n } = buildIcs(from, to, include);
  if (!n) { showToast('出力できる予定がありません'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/calendar;charset=utf-8' }));
  a.download = from === to ? `schedule-${from}.ics` : `schedule-${from}_${to}.ics`;
  a.click(); URL.revokeObjectURL(a.href); closeModal(); showToast(`${n}件を出力しました`);
}

// ───────── settings / gist ─────────
function openSettings() {
  const tok = lsGet('sched_gist_token') || '', gid = lsGet('sched_gist_id') || '';
  openModal(`<h3>設定<button class="btn btn-sm" onclick="closeModal()">✕</button></h3>
    <div class="sect" style="border:0;margin:0;padding:0"><h4>クラウド同期（GitHub Gist・このアプリ専用）</h4>
      <div class="row"><label>トークン</label><input type="password" id="st-token" value="${h(tok)}" placeholder="gist権限のトークン"></div>
      <div class="row"><label>Gist ID</label><input id="st-gid" value="${h(gid)}" placeholder="空欄で保存すると新規作成"></div>
      <div class="row"><button class="btn btn-sm" onclick="saveGistSettings()">設定を保存</button><button class="btn btn-sm btn-primary" onclick="gistPush()">☁ 保存（アップロード）</button><button class="btn btn-sm" onclick="gistPull()">☁ 読み込み</button></div>
      <div class="empty">データは ${GIST_FILE} に保存します。旧TODOアプリのGist（todo_app_data.json）とは別のGistです。</div></div>
    <div class="sect"><h4>テーマ（カンマ区切り）</h4><div class="row"><input id="st-themes" value="${h(S.themes.join(','))}"><button class="btn btn-sm" onclick="saveThemes()">保存</button></div></div>
    <div class="sect"><h4>作業枠テンプレート</h4>
      ${S.blockTemplates.map(t => `<div class="task-row"><span class="ttl">${h(t.title)} ${t.startTime}–${t.endTime} ${h(t.theme)}</span><button class="btn btn-sm" onclick="delTemplate('${t.id}')">削除</button></div>`).join('') || '<div class="empty">まだありません</div>'}
      <div class="row" style="margin-top:6px"><input id="tp-title" placeholder="名前"><input type="time" id="tp-s" value="09:00"><input type="time" id="tp-e" value="10:00"><select id="tp-th">${['', ...S.themes].map(t => `<option>${h(t)}</option>`).join('')}</select><button class="btn btn-sm" onclick="addTemplate()">追加</button></div></div>
    <div class="sect"><h4>バックアップ</h4><div class="row"><button class="btn btn-sm" onclick="exportJson()">JSON書き出し</button><label class="btn btn-sm" style="width:auto;color:var(--text)">JSON読み込み<input type="file" accept=".json" hidden onchange="importJson(this.files[0])"></label></div></div>
    <div class="sect"><h4>最近の変更（確定済みの予定のみ記録）</h4>
      ${S.changes.slice(-8).reverse().map(c => `<div class="empty">${c.at.slice(5, 16).replace('T', ' ')} ${h(c.title || '')} ${c.kind}${c.before && c.after && c.before.startTime ? `：${c.before.date} ${c.before.startTime}→${c.after.date} ${c.after.startTime}` : ''}</div>`).join('') || '<div class="empty">まだありません</div>'}</div>`);
}
function saveGistSettings() {
  const t = document.getElementById('st-token').value.trim(), g = document.getElementById('st-gid').value.trim();
  if (t) lsSet('sched_gist_token', t); if (g) lsSet('sched_gist_id', g);
  showToast('設定を保存しました'); showBanner();
}
function saveThemes() { S.themes = document.getElementById('st-themes').value.split(',').map(s => s.trim()).filter(Boolean); save(); openSettings(); renderAll(); }
function addTemplate() {
  const title = document.getElementById('tp-title').value.trim();
  S.blockTemplates.push({ id: uuid(), title, startTime: document.getElementById('tp-s').value, endTime: document.getElementById('tp-e').value, theme: document.getElementById('tp-th').value });
  save(); openSettings();
}
function delTemplate(id) { S.blockTemplates = S.blockTemplates.filter(t => t.id !== id); save(); openSettings(); }
function exportJson() {
  const data = payload(); const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `schedule_backup_${today().replace(/-/g, '')}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importJson(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => { try { applyData(JSON.parse(fr.result)); save(); closeModal(); renderAll(); showToast('読み込みました'); } catch (e) { showToast('読み込み失敗: ' + e.message); } };
  fr.readAsText(file);
}
function payload() { return { blocks: S.blocks, tasks: S.tasks, blockTemplates: S.blockTemplates, themes: S.themes, reviews: S.reviews, proposals: S.proposals, changes: S.changes, savedAt: new Date().toISOString() }; }
function applyData(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.blocks)) throw new Error('データ形式が不正です（blocksがありません）');
  for (const k of ['blocks', 'tasks', 'blockTemplates', 'themes', 'reviews', 'proposals', 'changes']) if (d[k] !== undefined) S[k] = d[k];
  normalizeData();
}
async function gistPush() {
  const token = lsGet('sched_gist_token'); let gid = lsGet('sched_gist_id');
  if (!token) { showToast('先にトークンを設定してください'); openSettings(); return; }
  try {
    if (gid) {
      const meta = await fetch(`https://api.github.com/gists/${gid}`, { headers: { Authorization: `token ${token}` } });
      if (!meta.ok) throw new Error((await meta.json()).message || meta.status);
      const m = await meta.json(); const last = lsGet('sched_last_saved');
      if (last && m.updated_at > last && !confirm('クラウドのほうが新しい可能性があります（他の端末やスクリプトが更新）。上書き保存しますか？\n［キャンセル］で中止 → 設定の「読み込み」で取り込めます')) return;
    }
    showToast('保存中…');
    const body = { description: 'Schedule App Data', public: false, files: { [GIST_FILE]: { content: JSON.stringify(payload(), null, 2) } } };
    const res = await fetch(gid ? `https://api.github.com/gists/${gid}` : 'https://api.github.com/gists', { method: gid ? 'PATCH' : 'POST', headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error((await res.json()).message || res.status);
    const d = await res.json(); if (!gid) lsSet('sched_gist_id', d.id);
    lsSet('sched_last_saved', d.updated_at || new Date().toISOString()); _dirty = false; hideBanner(); showToast('☁ クラウドに保存しました');
  } catch (e) { showToast('エラー: ' + e.message); }
}
async function gistPull() {
  const token = lsGet('sched_gist_token'), gid = lsGet('sched_gist_id');
  if (!token || !gid) { showToast('トークンとGist IDを設定してください'); openSettings(); return; }
  try {
    showToast('読込中…');
    const res = await fetch(`https://api.github.com/gists/${gid}`, { headers: { Authorization: `token ${token}` } });
    if (!res.ok) throw new Error((await res.json()).message || res.status);
    const data = await res.json(); const f = data.files[GIST_FILE]; if (!f) throw new Error(GIST_FILE + ' が見つかりません');
    let raw = f.content;
    if (f.truncated) { const r = await fetch(f.raw_url); if (!r.ok) throw new Error('rawデータの取得に失敗'); raw = await r.text(); }
    applyData(JSON.parse(raw)); save();
    lsSet('sched_last_saved', data.updated_at || new Date().toISOString()); _dirty = false; hideBanner(); closeModal(); renderAll(); showToast('☁ 読み込みました');
  } catch (e) { showToast('エラー: ' + e.message); }
}
window.addEventListener('beforeunload', e => { if (_dirty && lsGet('sched_gist_token')) { e.preventDefault(); e.returnValue = ''; } });

// ───────── init ─────────
if (window.innerWidth <= 600) S.view = 'day';   // スマホ幅は日ビューから始める（週は列が狭くなるため）
{ const z = parseInt(lsGet('sched_zoom'), 10); S.zoom = (z >= 0 && z < ZOOMS.length) ? z : (window.innerWidth <= 600 ? 1 : 0); HH = ZOOMS[S.zoom].hh; }
loadAll(); renderAll();
</script>
</body>
